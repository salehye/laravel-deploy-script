# PHP-FPM Pool Configuration Template
# Used for creating isolated PHP pools for each project

[{{USER}}]
user = {{USER}}
group = {{USER}}

listen = /run/php/php{{PHP_VERSION}}-{{USER}}-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

php_admin_value[open_basedir] = {{SITE_PATH}}/current:/tmp
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[upload_max_filesize] = 50M
php_admin_flag[display_errors] = off
php_admin_value[error_log] = {{SITE_PATH}}/logs/php-error.log
php_admin_value[session.save_path] = {{SITE_PATH}}/shared/storage/framework/sessions
