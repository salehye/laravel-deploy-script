# Supervisor Process Template
# Used for Laravel Queue Workers

[program:{{PROJECT_NAME}}_worker]
process_name=%(program_name)s_%(process_num)02d
command=php {{SITE_PATH}}/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{USER}}
numprocs=2
redirect_stderr=true
stdout_logfile={{SITE_PATH}}/logs/worker.log
stopwaitsecs=3600
