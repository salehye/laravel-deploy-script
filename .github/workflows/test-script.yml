name: 🧪 Test Laravel Deploy Script

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday

jobs:
  test:
    name: Script Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_mysql, bcmath, curl, json
      
      - name: ✅ Validate Script Syntax
        run: bash -n deploy.sh
      
      - name: 🔍 Check for Banned Keywords
        run: |
          if grep -r "eval(" deploy.sh; then
            echo "⚠️ Found eval in script"
            exit 1
          fi
          if grep -r "base64_decode" deploy.sh; then
            echo "⚠️ Found base64_decode in script"
            exit 1
          fi
      
      - name: 📊 Verify Core Tool Usage
        run: |
          echo "## Core Command Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for cmd in curl wget git nginx php composer mysql; do
            if grep -q "$cmd" deploy.sh; then
              echo "- ✅ $cmd" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ $cmd" >> $GITHUB_STEP_SUMMARY
            fi
          done
      
      - name: 📝 Verify Version
        run: |
          VERSION=$(grep -E '^SCRIPT_VERSION=' deploy.sh | cut -d'"' -f2)
          echo "📌 Script Version: v$VERSION"
          echo "**Script Version:** v$VERSION" >> $GITHUB_STEP_SUMMARY
      
      - name: 🚀 Dry Run Test (Simulation)
        run: |
          # List main functions without executing
          grep -E '^[a-z_]+\(\)' deploy.sh | head -10
      
      - name: 📦 Install Test Dependencies
        run: |
          sudo apt update
          sudo apt install -y shellcheck
      
      - name: 🔍 ShellCheck Analysis
        run: |
          shellcheck deploy.sh || true
      
      - name: 📋 Generate Test Report
        run: |
          echo "# ✅ Laravel Deploy Script Test Report" > test-report.md
          echo "" >> test-report.md
          echo "## 📊 Script Information" >> test-report.md
          echo "- **Version:** $(grep 'SCRIPT_VERSION=' deploy.sh | cut -d'"' -f2)" >> test-report.md
          echo "- **Test Date:** $(date)" >> test-report.md
          echo "- **PHP Version:** ${{ matrix.php-version }}" >> test-report.md
          echo "" >> test-report.md
          echo "## 📈 Statistics" >> test-report.md
          echo "- **Lines:** $(wc -l < deploy.sh)" >> test-report.md
          echo "- **Functions:** $(grep -c '^[a-z_]*()' deploy.sh)" >> test-report.md
          echo "- **Unique Commands:** $(grep -oE '^[a-z-]+' deploy.sh | sort -u | wc -l)" >> test-report.md
          
          cat test-report.md >> $GITHUB_STEP_SUMMARY
      
      - name: 💾 Save Test Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-php-${{ matrix.php-version }}
          path: test-report.md
